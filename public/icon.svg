<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001c3c"/>
      <stop offset="100%" stop-color="#000d1e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle inner ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#1e3a5f" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Wallet / Ledger Base -->
  <rect x="110" y="140" width="292" height="232" rx="36" fill="#0f294a" stroke="#2563eb" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Front Card / Cash Note Accent -->
  <rect x="130" y="180" width="252" height="172" rx="28" fill="#14365d" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Golden Coin Emblem with 'U' -->
  <circle cx="256" cy="266" r="62" fill="url(#gold)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))"/>
  
  <!-- Untungin 'U' Monogram & Upward Growth -->
  <path d="M 230 236 L 230 268 C 230 286 242 296 256 296 C 270 296 282 286 282 268 L 282 236" fill="none" stroke="#001c3c" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Profit Growth Arrow (Emerald) -->
  <path d="M 330 190 L 390 130 M 390 130 L 345 130 M 390 130 L 390 175" fill="none" stroke="url(#emerald)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
